<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Afinador</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@400;500;600&family=Chivo+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Tokens: copia de src/styles/tokens.css (SDS). Solo modo oscuro. Tipografía: ADR 0005. */
@font-face { font-family: "Amstelvar"; src: url("/fonts/amstelvar-roman.woff2") format("woff2"); font-weight: 300 700; font-style: normal; font-display: swap; }
:root {
  color-scheme: dark;
  --color-bg-page: #0e1114; --color-bg-surface: #171b20; --color-bg-elevated: #20262d;
  --color-text-primary: #e8ecf1; --color-text-secondary: #8c96a3; --color-accent: #d2734e;
  --color-ok: #7fc8a9;
  --line: color-mix(in srgb, #8c96a3 16%, transparent);
  --font-sans: "Host Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-serif: "Amstelvar", Georgia, "Times New Roman", serif;
  --font-mono: "Chivo Mono", ui-monospace, Menlo, monospace;
  --space-8: 8px; --space-16: 16px; --space-24: 24px; --space-32: 32px; --space-48: 48px;
  --radius-card: 20px; --radius-pill: 999px;
  --text-title-size: clamp(32px, 2.5vw + 20px, 40px); --text-title-line: 1.2;
  --text-body-l-size: 18px; --text-body-l-line: 28px;
  --text-meta-size: 12px; --text-meta-line: 16px; --text-meta-tracking: 0.04em;
  --ease-settle: cubic-bezier(0.22, 1, 0.36, 1);
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100dvh; background: var(--color-bg-page); color: var(--color-text-primary); font-family: var(--font-sans);
  font-size: var(--text-body-l-size); line-height: var(--text-body-l-line); -webkit-font-smoothing: antialiased; }
main { max-width: 560px; margin: 0 auto; padding: var(--space-48) var(--space-16); display: flex; flex-direction: column; gap: var(--space-32); }
h1 { margin: 0; font-family: var(--font-serif); font-weight: 400; font-size: var(--text-title-size); line-height: var(--text-title-line); }
p { margin: 0; }
.rail { font-family: var(--font-mono); font-size: var(--text-meta-size); line-height: var(--text-meta-line); letter-spacing: var(--text-meta-tracking); color: var(--color-text-secondary); text-transform: uppercase; }
.muted { color: var(--color-text-secondary); }
header { display: flex; flex-direction: column; gap: var(--space-8); }

.dial { background: var(--color-bg-surface); border-radius: var(--radius-card); padding: var(--space-32) var(--space-16) var(--space-24);
  display: flex; flex-direction: column; align-items: center; gap: var(--space-16); }
.note { font-family: var(--font-serif); font-size: 112px; line-height: 1; min-height: 112px; display: flex; align-items: baseline; gap: 4px; }
.note sub { font-family: var(--font-mono); font-size: 20px; color: var(--color-text-secondary); }
.solfa { font-family: var(--font-mono); font-size: var(--text-meta-size); letter-spacing: var(--text-meta-tracking); color: var(--color-text-secondary); text-transform: uppercase; min-height: 16px; }
.gauge { width: 100%; max-width: 420px; }
.gauge svg { display: block; width: 100%; height: auto; overflow: visible; }
.tick { stroke: var(--color-text-secondary); stroke-width: 1.5; stroke-linecap: round; }
.tick-zero { stroke: var(--color-text-primary); stroke-width: 2; }
.tlbl { font-family: var(--font-mono); font-size: 11px; fill: var(--color-text-secondary); }
.needle { stroke: var(--color-accent); stroke-width: 3; stroke-linecap: round; transform-origin: 160px 170px; transition: transform 120ms linear, stroke 200ms; }
.hub { fill: var(--color-accent); transition: fill 200ms; }
.dial.ok .needle { stroke: var(--color-ok); }
.dial.ok .hub { fill: var(--color-ok); }
.dial.idle .needle { stroke: var(--color-text-secondary); }
.dial.idle .hub { fill: var(--color-text-secondary); }
.readout { display: flex; gap: var(--space-24); font-family: var(--font-mono); font-size: 14px; color: var(--color-text-secondary); font-variant-numeric: tabular-nums; }
.hint { font-size: 16px; min-height: 28px; text-align: center; }
.dial.ok .hint { color: var(--color-ok); }

.strings { display: grid; grid-template-columns: repeat(6, 1fr); gap: var(--space-8); }
.strings button { appearance: none; border: 1px solid var(--line); background: var(--color-bg-surface); color: var(--color-text-primary);
  border-radius: 12px; padding: 10px 0 8px; font: inherit; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.strings button span { font-family: var(--font-mono); font-size: 11px; color: var(--color-text-secondary); }
.strings button[aria-pressed="true"] { border-color: var(--color-accent); background: color-mix(in srgb, #d2734e 14%, var(--color-bg-surface)); }
.strings button:focus-visible, .primary:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }

.primary { appearance: none; border: 0; background: var(--color-accent); color: #0e1114; font: inherit; font-weight: 500;
  border-radius: var(--radius-pill); padding: 12px 24px; cursor: pointer; align-self: center; min-height: 48px; }
.primary[data-on="true"] { background: var(--color-bg-elevated); color: var(--color-text-primary); }
.error { color: var(--color-accent); font-size: 16px; text-align: center; }
footer { font-size: 14px; line-height: 20px; }
@media (prefers-reduced-motion: reduce) { .needle { transition: none; } }
</style>
</head>
<body>
<main>
<header>
  <p class="rail">Lab · Somara Studio</p>
  <h1>Afinador</h1>
  <p class="muted">Afinación estándar de guitarra. Toca una cuerda cerca del micrófono; la aguja te dice si subir o bajar.</p>
</header>

<section class="dial idle" id="dial" aria-live="polite">
  <div class="note" id="note">–</div>
  <p class="solfa" id="solfa"></p>
  <div class="gauge" aria-hidden="true">
    <svg viewBox="0 0 320 190" id="gauge">
      <g id="ticks"></g>
      <line class="needle" id="needle" x1="160" y1="170" x2="160" y2="40"/>
      <circle class="hub" cx="160" cy="170" r="6"/>
    </svg>
  </div>
  <div class="readout"><span id="freq">— Hz</span><span id="cents">± 0 ¢</span></div>
  <p class="hint" id="hint">Activa el micrófono para empezar.</p>
</section>

<div class="strings" role="group" aria-label="Cuerda objetivo" id="strings"></div>

<button class="primary" id="toggle" type="button">Activar micrófono</button>
<p class="error" id="error" hidden></p>

<footer class="muted">Sin cuerda elegida, detecta la nota más cercana. El audio se procesa en tu navegador; no se graba ni se envía.</footer>
</main>

<script>
(() => {
  const NAMES = ["C", "C♯", "D", "D♯", "E", "F", "F♯", "G", "G♯", "A", "A♯", "B"];
  const SOLFA = ["Do", "Do♯", "Re", "Re♯", "Mi", "Fa", "Fa♯", "Sol", "Sol♯", "La", "La♯", "Si"];
  // Standard tuning, low to high, as MIDI numbers: E2 A2 D3 G3 B3 E4.
  const STRINGS = [40, 45, 50, 55, 59, 64];
  const IN_TUNE = 5; // cents

  const $ = (id) => document.getElementById(id);
  const dial = $("dial"), noteEl = $("note"), solfaEl = $("solfa"), needle = $("needle");
  const freqEl = $("freq"), centsEl = $("cents"), hint = $("hint"), toggle = $("toggle"), errorEl = $("error");

  const midiToFreq = (m) => 440 * Math.pow(2, (m - 69) / 12);
  const freqToMidi = (f) => 69 + 12 * Math.log2(f / 440);

  // Gauge ticks from −50 to +50 cents across a 120° arc.
  const ticks = $("ticks");
  for (let c = -50; c <= 50; c += 10) {
    const a = (c / 50) * 60 * Math.PI / 180;
    const r1 = 130, r2 = c === 0 ? 112 : 120;
    const x = (r) => 160 + r * Math.sin(a), y = (r) => 170 - r * Math.cos(a);
    const l = document.createElementNS("http://www.w3.org/2000/svg", "line");
    l.setAttribute("x1", x(r1)); l.setAttribute("y1", y(r1)); l.setAttribute("x2", x(r2)); l.setAttribute("y2", y(r2));
    l.setAttribute("class", c === 0 ? "tick tick-zero" : "tick");
    ticks.appendChild(l);
    if (c % 50 === 0) {
      const t = document.createElementNS("http://www.w3.org/2000/svg", "text");
      t.setAttribute("x", x(148)); t.setAttribute("y", y(148) + 4); t.setAttribute("text-anchor", "middle");
      t.setAttribute("class", "tlbl"); t.textContent = c > 0 ? "+" + c : String(c);
      ticks.appendChild(t);
    }
  }

  let target = null;
  const stringsEl = $("strings");
  STRINGS.forEach((m, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.setAttribute("aria-pressed", "false");
    b.innerHTML = NAMES[m % 12] + "<span>" + (6 - i) + "ª</span>";
    b.setAttribute("aria-label", "Cuerda " + (6 - i) + ", " + SOLFA[m % 12] + " " + midiToFreq(m).toFixed(1) + " hercios");
    b.addEventListener("click", () => {
      target = target === m ? null : m;
      stringsEl.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", String(x === b && target !== null)));
    });
    stringsEl.appendChild(b);
  });

  // Pitch detection: normalized autocorrelation with parabolic interpolation (good enough for 70–1000 Hz).
  function detect(buf, rate) {
    const n = buf.length;
    let rms = 0;
    for (let i = 0; i < n; i++) rms += buf[i] * buf[i];
    rms = Math.sqrt(rms / n);
    if (rms < 0.01) return null;

    const minLag = Math.floor(rate / 1000), maxLag = Math.min(Math.floor(rate / 70), n >> 1);
    const corr = new Float32Array(maxLag + 2);
    for (let lag = minLag; lag <= maxLag + 1; lag++) {
      let s = 0, e1 = 0, e2 = 0;
      for (let i = 0; i < n - lag; i++) { s += buf[i] * buf[i + lag]; e1 += buf[i] * buf[i]; e2 += buf[i + lag] * buf[i + lag]; }
      corr[lag] = s / Math.sqrt(e1 * e2 || 1);
    }
    // First peak that clears 90% of the best one avoids octave errors.
    let best = 0;
    for (let lag = minLag; lag <= maxLag; lag++) if (corr[lag] > best) best = corr[lag];
    if (best < 0.8) return null;
    let lag = minLag;
    for (let l = minLag + 1; l < maxLag; l++) {
      if (corr[l] > 0.9 * best && corr[l] >= corr[l - 1] && corr[l] >= corr[l + 1]) { lag = l; break; }
    }
    const a = corr[lag - 1], b = corr[lag], c = corr[lag + 1];
    const shift = (a - c) / (2 * (a - 2 * b + c) || 1);
    return rate / (lag + (Number.isFinite(shift) ? shift : 0));
  }

  let ctx, analyser, stream, raf, smooth = null, silentFrames = 0;
  const buf = new Float32Array(2048);
  let frame = 0;

  function render(freq) {
    if (freq == null) {
      if (++silentFrames > 30) {
        dial.className = "dial idle";
        needle.style.transform = "rotate(0deg)";
        hint.textContent = "Escuchando…";
        smooth = null;
      }
      return;
    }
    silentFrames = 0;
    smooth = smooth == null ? freq : smooth * 0.7 + freq * 0.3;
    const midi = freqToMidi(smooth);
    const ref = target ?? Math.round(midi);
    const cents = Math.max(-50, Math.min(50, (midi - ref) * 100));
    const name = NAMES[((ref % 12) + 12) % 12];
    noteEl.innerHTML = name + "<sub>" + (Math.floor(ref / 12) - 1) + "</sub>";
    solfaEl.textContent = SOLFA[((ref % 12) + 12) % 12];
    freqEl.textContent = smooth.toFixed(1) + " Hz";
    centsEl.textContent = (cents > 0 ? "+" : cents < 0 ? "−" : "±") + " " + Math.abs(cents).toFixed(0) + " ¢";
    needle.style.transform = "rotate(" + (cents / 50) * 60 + "deg)";
    const ok = Math.abs(cents) <= IN_TUNE;
    dial.className = ok ? "dial ok" : "dial";
    hint.textContent = ok ? "Afinada" : cents < 0 ? "Sube: aprieta la cuerda" : "Baja: afloja la cuerda";
  }

  function loop() {
    // Detect on every other frame; autocorrelation is the costly part on phones.
    if (frame++ % 2 === 0) {
      analyser.getFloatTimeDomainData(buf);
      render(detect(buf, ctx.sampleRate));
    }
    raf = requestAnimationFrame(loop);
  }

  async function start() {
    errorEl.hidden = true;
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
    } catch (e) {
      errorEl.textContent = "No pude usar el micrófono. Revisa el permiso del navegador e inténtalo de nuevo.";
      errorEl.hidden = false;
      return;
    }
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = ctx.createAnalyser();
    analyser.fftSize = 2048;
    ctx.createMediaStreamSource(stream).connect(analyser);
    toggle.textContent = "Detener";
    toggle.dataset.on = "true";
    hint.textContent = "Escuchando…";
    loop();
  }

  function stop() {
    cancelAnimationFrame(raf);
    stream?.getTracks().forEach((t) => t.stop());
    ctx?.close();
    ctx = null;
    toggle.textContent = "Activar micrófono";
    toggle.dataset.on = "false";
    dial.className = "dial idle";
    needle.style.transform = "rotate(0deg)";
    hint.textContent = "Activa el micrófono para empezar.";
  }

  toggle.addEventListener("click", () => (ctx ? stop() : start()));
})();
</script>
</body>
</html>
